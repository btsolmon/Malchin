<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Малчин — Survival Prototype</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #1a1510;
        color: #f2e8d5;
        font-family: "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 0.75rem;
        padding: 1rem;
      }
      h1 {
        font-weight: 600;
        letter-spacing: 0.06em;
        font-size: 1.25rem;
        color: #e8c56a;
      }
      canvas {
        display: block;
        background: #2c4a2e;
        border: 2px solid #8a6a3a;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        image-rendering: pixelated;
        max-width: 100%;
      }
      .hint {
        font-size: 0.8rem;
        color: #a89880;
        text-align: center;
        line-height: 1.5;
      }
      kbd {
        background: #3a3020;
        border: 1px solid #6a5840;
        border-radius: 3px;
        padding: 0 0.35em;
        font-size: 0.85em;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Малчин · Сүрэг хамгаалал</h1>
      <canvas id="game" width="960" height="540"></canvas>
      <p class="hint">
        <kbd>WASD</kbd> хөдлөх ·
        <kbd>Space</kbd>/<kbd>J</kbd> тулалдах ·
        <kbd>E</kbd> мод/жимс түүх ·
        <kbd>Q</kbd> жимс идэх ·
        <kbd>F</kbd> гал (шөнө) ·
        Зорилго: <strong>1000 хонь</strong>
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
